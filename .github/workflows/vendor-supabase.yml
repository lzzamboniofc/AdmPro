name: Vendor Supabase UMD from official npm
on:
  push:
    branches: [feature/supabase-assinaturas-staging]
    paths:
      - .github/workflows/vendor-supabase.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch pinned official npm tarball and vendor UMD
        shell: bash
        run: |
          set -euo pipefail
          pkg='@supabase/supabase-js@2.117.3'
          mkdir -p "$RUNNER_TEMP/admpro-vendor"
          npm pack "$pkg" --pack-destination "$RUNNER_TEMP/admpro-vendor" --ignore-scripts
          tar -xzf "$RUNNER_TEMP/admpro-vendor/supabase-supabase-js-2.117.3.tgz" -C "$RUNNER_TEMP/admpro-vendor"
          test -s "$RUNNER_TEMP/admpro-vendor/package/dist/umd/supabase.js"
          cp "$RUNNER_TEMP/admpro-vendor/package/dist/umd/supabase.js" js/vendor/supabase.js
          node --check js/vendor/supabase.js
          sha256sum js/vendor/supabase.js > js/vendor/supabase.js.sha256
      - name: Commit official pinned bundle to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/vendor/supabase.js js/vendor/supabase.js.sha256
          if ! git diff --cached --quiet; then
            git commit -m "vendor: pin official Supabase JS UMD v2.117.3"
            git push origin HEAD:feature/supabase-assinaturas-staging
          fi
